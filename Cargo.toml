[package]
name = "document-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.92"
description = "Local document interchange"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { git = "https://github.com/ahmad-v/localwright", rev = "684c98339d2c9a6d68609039c03d531fdc47f9b7", version = "=0.1.0" }
localwright-ui = { git = "https://github.com/ahmad-v/localwright", rev = "684c98339d2c9a6d68609039c03d531fdc47f9b7", version = "=0.1.0", optional = true }
serde_json = "=1.0.140"
sha2 = { version = "=0.10.9", optional = true }
tempfile = { version = "=3.19.1", optional = true }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
lopdf = { version = "=0.42.0", default-features = false }
quick-xml = "=0.42.0"
pulldown-cmark = { version = "=0.13.0", default-features = false, features = ["html"] }
image = { version = "=0.25.8", default-features = false, features = ["png"] }
hayro = { version = "=0.9.0" }
iced = { version = "=0.13.1", default-features = false, features = ["tiny-skia", "fira-sans", "image-without-codecs"], optional = true }
rfd = { version = "=0.15.4", default-features = false, features = ["async-std", "xdg-portal"], optional = true }


[features]
default = ["gui"]
gui = ["dep:localwright-ui", "dep:iced", "dep:rfd"]
ocr = ["dep:sha2", "dep:tempfile"]

[dev-dependencies]
tempfile = "=3.19.1"
