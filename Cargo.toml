[package]
name = "document-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
description = "Local document interchange"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { git = "https://github.com/ahmad-v/localwright", rev = "b18f5303ca5e7684881ccce9951cbee8b25dea82", version = "=0.1.0" }
localwright-ui = { git = "https://github.com/ahmad-v/localwright", rev = "b18f5303ca5e7684881ccce9951cbee8b25dea82", version = "=0.1.0", optional = true }
serde_json = "=1.0.140"
sha2 = { version = "=0.10.9", optional = true }
tempfile = { version = "=3.19.1", optional = true }
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
lopdf = { version = "=0.42.0", default-features = false }
quick-xml = "=0.42.0"


[features]
default = ["gui"]
gui = ["dep:localwright-ui"]
ocr = ["dep:sha2", "dep:tempfile"]

[dev-dependencies]
tempfile = "=3.19.1"
