name: Distribution preparation

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build unsigned portable previews or enabled configured package targets
        required: true
        type: choice
        options:
          - portable-preview
          - configured-packages
        default: portable-preview

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: distribution-${{ github.ref }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  portable-preview:
    name: Portable preview (${{ matrix.target }})
    if: inputs.mode == 'portable-preview'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            arch: X64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: ARM64
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: X64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: ARM64
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: ARM64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
      - name: Install Linux GUI build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Cache Cargo dependencies and target output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: document-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-release-default-gui-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            document-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-release-default-gui-
      - name: Build optimized binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --locked --release --target "$BUILD_TARGET"
      - name: Package, extract, and smoke-test portable preview
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          executable=document-studio
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable=document-studio.exe
            python_cmd=python
          fi
          "$python_cmd" packaging/portable.py \
            --target "$BUILD_TARGET" \
            --binary "target/$BUILD_TARGET/release/$executable" \
            --output dist/preview
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: document-studio-preview-${{ matrix.target }}
          path: dist/preview/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  package-plan:
    name: Plan configured package matrix
    if: inputs.mode == 'configured-packages'
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read configured target-format combinations
        id: plan
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("packaging/config.json").read_text())
          combinations = [
              {"runner": target["runner"], "target": target["target"], "arch": "ARM64" if target["target"].startswith("aarch64") else "X64", "format": fmt}
              for target in config["targets"]
              for fmt in target["formats"]
          ]
          enabled = bool(config.get("approved_identity")) and bool(config.get("maintainer"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"enabled={'true' if enabled else 'false'}\n")
              output.write("matrix=" + json.dumps({"include": combinations if enabled else []}, separators=(",", ":")) + "\n")
          print(f"Configured {len(combinations)} target-format combinations.")
          print("Maintainer identity and package approval are present." if enabled else "Package builds are held: the package identity and maintainer remain unapproved.")
          PY

  package-approval-held:
    name: Package builds held for identity approval
    needs: package-plan
    if: inputs.mode == 'configured-packages' && needs.package-plan.outputs.enabled != 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice::Configured package matrix is retained in packaging/config.json and packaging/package.py, but no package is built until the provisional identity and maintainer are approved. No release or publication was performed."

  configured-packages:
    name: ${{ matrix.format }} (${{ matrix.target }})
    needs: package-plan
    if: inputs.mode == 'configured-packages' && needs.package-plan.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: test "$RUNNER_ARCH" = "$EXPECTED_ARCH"
      - name: Install Linux GUI build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - name: Install RPM build utility
        if: matrix.format == 'rpm'
        run: sudo apt-get install -y rpm
      - name: Cache Cargo dependencies and target output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: document-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-release-default-gui-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            document-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml') }}-release-default-gui-
      - name: Build optimized binary
        env:
          BUILD_TARGET: ${{ matrix.target }}
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: cargo build --locked --release --target "$BUILD_TARGET"
      - name: Assemble configured package
        env:
          BUILD_TARGET: ${{ matrix.target }}
          PACKAGE_FORMAT: ${{ matrix.format }}
        run: |
          executable=document-studio
          python_cmd=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            executable=document-studio.exe
            python_cmd=python
          fi
          "$python_cmd" packaging/package.py \
            --target "$BUILD_TARGET" \
            --format "$PACKAGE_FORMAT" \
            --binary "target/$BUILD_TARGET/release/$executable"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: document-studio-package-${{ matrix.target }}-${{ matrix.format }}
          path: dist/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
