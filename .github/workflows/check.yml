name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          code_changed=false
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              *.md|docs/*|LICENSE|LICENSE-*|AUTHORS|CITATION.cff|CODE_OF_CONDUCT.md|CONTRIBUTING.md|MANIFESTO.md|SECURITY.md|THIRD_PARTY_NOTICES.md|packaging/README.md|packaging/STATUS.csv|packaging/config.json)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done <<< "$changed"
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"

      - name: Validate documentation artifacts
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base="$PUSH_BASE_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          fi
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]]; then
            git diff --check "$base" "$HEAD_SHA"
          else
            git diff --check
          fi
          python3 -m json.tool docs/capabilities.json >/dev/null
          python3 -m json.tool packaging/config.json >/dev/null
          python3 - <<'PY'
          import ast
          from pathlib import Path

          for source in sorted([*Path("packaging").glob("*.py"), *Path("scripts").glob("*.py")]):
              ast.parse(source.read_text(encoding="utf-8"), filename=str(source))
          PY

      - name: Verify fast offline packer tests
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v

      - name: Install Linux GUI build prerequisites
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - name: Cache Cargo dependencies and target output
        if: steps.scope.outputs.code_changed == 'true'
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: document-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-debug-default-gui-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            document-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-debug-default-gui-

      - name: Verify locked manifest and local capability registry
        if: steps.scope.outputs.code_changed == 'true'
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Verify formatting, compilation, tests, and Clippy
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          cargo --version
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
