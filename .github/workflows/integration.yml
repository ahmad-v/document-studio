name: Integration

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-integration:
    name: GUI, headless, and OCR adapters (Linux x64)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'integration')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Linux GUI build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb strace
      - name: Cache Cargo dependencies and target output
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target
          key: document-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-integration-default-ocr-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            document-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-integration-default-ocr-
      - name: Verify manifests and operation registry
        run: |
          cargo metadata --locked --format-version 1 --no-deps >/dev/null
          python3 -m json.tool docs/capabilities.json >/dev/null
          git diff --check
      - name: Verify default GUI build and tests
        run: |
          cargo build --locked --bin document-studio
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Smoke-test native GUI startup under Xvfb
        run: |
          log_file="$(mktemp)"
          set +e
          xvfb-run -a timeout --signal=TERM --kill-after=5s 20s target/debug/document-studio >"$log_file" 2>&1
          status=$?
          set -e
          cat "$log_file"
          if grep -Eiq 'panicked at|thread .* panicked|panic occurred' "$log_file"; then
            echo "The GUI process reported a panic." >&2
            exit 1
          fi
          rm -f "$log_file"
          case "$status" in
            0|124|143) ;;
            *) echo "GUI startup smoke failed with exit status $status." >&2; exit "$status" ;;
          esac
      - name: Verify headless build and CLI
        run: |
          cargo test --locked --no-default-features
          cargo run --locked --no-default-features -- --cli --help
      - name: Verify optional OCR adapter build and tests
        run: |
          cargo check --locked --features ocr --all-targets
          cargo test --locked --features ocr
      - name: Verify private Pandoc structural conversions offline
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/pandoc-3.14-linux-amd64.tar.gz"
          curl --fail --location --retry 3 --output "$archive" https://github.com/jgm/pandoc/releases/download/3.14/pandoc-3.14-linux-amd64.tar.gz
          source_archive="$RUNNER_TEMP/pandoc-3.14-source.tar.gz"
          curl --fail --location --retry 3 --output "$source_archive" https://hackage.haskell.org/package/pandoc-3.14/pandoc-3.14.tar.gz
          python3 packaging/pandoc_engine.py "$archive" "$RUNNER_TEMP/pandoc-pack" "$source_archive"
          cp -R "$RUNNER_TEMP/pandoc-pack/engines" target/debug/
          cp -R "$RUNNER_TEMP/pandoc-pack/third-party" target/debug/
          input="$RUNNER_TEMP/pandoc-input.md"
          docx="$RUNNER_TEMP/pandoc-roundtrip.docx"
          markdown="$RUNNER_TEMP/pandoc-roundtrip.md"
          html="$RUNNER_TEMP/pandoc-report.html"
          epub="$RUNNER_TEMP/pandoc-report.epub"
          printf '# Lab results\n\nUnicode: café and μ.\n\n| Treatment | Value |\n| --- | --- |\n| Control | 3 |\n' > "$input"
          target/debug/document-studio --cli convert-document "$input" "$docx" ''
          target/debug/document-studio --cli convert-document "$docx" "$markdown" ''
          grep -q 'Lab results' "$markdown"
          grep -q 'café' "$markdown"
          trace="$RUNNER_TEMP/pandoc-offline.trace"
          strace -f -qq -e trace=network -o "$trace" target/debug/document-studio --cli convert-document "$input" "$html" '{"title":"Offline report","author":"Research Group","language":"en-GB"}'
          if grep -Eq 'socket\(AF_INET6?,|connect\(.*sa_family=AF_INET6?|sendto\(.*sa_family=AF_INET6?|sendmsg\(.*sa_family=AF_INET6?' "$trace"; then
            echo "Pandoc conversion attempted IP network access" >&2
            cat "$trace" >&2
            exit 1
          fi
          grep -q '<title>Offline report</title>' "$html"
          target/debug/document-studio --cli convert-document "$input" "$epub" ''
          python3 - "$docx" "$epub" <<'PY'
          import sys, zipfile
          for path in sys.argv[1:]:
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None, f"corrupt archive: {path}"
          with zipfile.ZipFile(sys.argv[2]) as epub_file:
              assert epub_file.read("mimetype") == b"application/epub+zip"
          print("Verified private offline Markdown/DOCX/HTML/EPUB routes and package integrity")
          PY
      - name: Verify pinned Localwright dependency graph
        run: |
          cargo tree --locked -i localwright-core
          cargo tree --locked -i localwright-ui
